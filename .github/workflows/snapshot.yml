name: Snapshot ArcGIS-data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspiser tjenester
        run: python3 scripts/snapshot.py --inspect > data/inspect.txt 2>&1 || true
      - name: Last ned kommunens lag
        run: python3 scripts/snapshot.py || true
      - name: Last ned OSM-gateparkering
        run: python3 scripts/osm_parking.py || true
      - name: Last ned NVDB-skilt
        run: python3 scripts/nvdb_skilt.py > data/nvdb_log.txt 2>&1 || true
      - name: Last ned flere NVDB-lag (P-områder, lommer, gatenavn)
        run: python3 scripts/nvdb_ekstra.py > data/nvdb_ekstra_log.txt 2>&1 || true
      - name: Utled strekninger fra skilt
        run: python3 scripts/nvdb_strekninger.py > data/nvdb_strekninger_log.txt 2>&1 || true
      - name: Commit data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
