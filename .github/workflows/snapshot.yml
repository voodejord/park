name: Snapshot ArcGIS-data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspiser tjenester
        run: python3 scripts/snapshot.py --inspect > data/inspect.txt 2>&1 || true
      - name: Last ned lag
        run: python3 scripts/snapshot.py || true
      - name: Commit data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
