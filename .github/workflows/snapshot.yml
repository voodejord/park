name: Snapshot ArcGIS-data
on:
  workflow_dispatch:          # manuell knapp
  schedule:
    - cron: "0 4 * * 1"       # mandager 04:00 UTC
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspiser tjenester (til loggen)
        run: python3 scripts/snapshot.py --inspect || true
      - name: Last ned lag
        run: python3 scripts/snapshot.py
      - name: Commit data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/*.geojson
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
